<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B0F0D">
<meta name="description" content="GPS HQ: a phone app for a Cleveland house flipper. Sample data.">
<meta charset="utf-8">
<title>GPS HQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Green, white and black with Liquid Glass: frosted panels over a soft green canvas.
   Phone = one column + floating glass tab bar. Desktop = main area + the AI team panel on the right. */
:root {
  --bg: #EDF3EF; --glow1: rgba(34, 197, 94, .26); --glow2: rgba(16, 163, 74, .16); --glow3: rgba(11, 15, 13, .07);
  --card: rgba(255, 255, 255, .64); --card2: rgba(11, 15, 13, .035); --solid: #FFFFFF;
  --glass: linear-gradient(180deg, rgba(255, 255, 255, .82), rgba(255, 255, 255, .56));
  --glass-edge: rgba(255, 255, 255, .85); --glass-hi: rgba(255, 255, 255, .95); --blur: blur(22px) saturate(170%);
  --ink: #0B0F0D; --ink2: #2D3832; --muted: #5F6C64; --line: rgba(11, 15, 13, .09); --soft: rgba(11, 15, 13, .055);
  --accent: #128C4A; --accent-ink: #FFFFFF;
  --blue: #128C4A; --blue-soft: rgba(18, 140, 74, .12); --green: #128C4A; --green-soft: rgba(18, 140, 74, .12);
  --teal: #0A6B38; --teal-soft: rgba(10, 107, 56, .12); --violet: #0B0F0D; --violet-soft: rgba(11, 15, 13, .07);
  --orange: #B26B12; --orange-soft: rgba(196, 122, 20, .14); --red: #CF2E37; --red-soft: rgba(207, 46, 55, .11);
  --pill: #0B0F0D; --pill-ink: #FFFFFF; --bar: rgba(11, 15, 13, .78);
  --shadow: 0 1px 1px rgba(0, 0, 0, .03), 0 10px 28px rgba(8, 48, 24, .09);
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #050806; --glow1: rgba(34, 197, 94, .22); --glow2: rgba(16, 163, 74, .12); --glow3: rgba(255, 255, 255, .04);
  --card: rgba(255, 255, 255, .07); --card2: rgba(255, 255, 255, .05); --solid: #111614;
  --glass: linear-gradient(180deg, rgba(255, 255, 255, .11), rgba(255, 255, 255, .045));
  --glass-edge: rgba(255, 255, 255, .13); --glass-hi: rgba(255, 255, 255, .2);
  --ink: #F0F5F1; --ink2: #CFDAD3; --muted: #8C9A91; --line: rgba(255, 255, 255, .09); --soft: rgba(255, 255, 255, .07);
  --accent: #3DDC84; --accent-ink: #04140A;
  --blue: #3DDC84; --blue-soft: rgba(61, 220, 132, .15); --green: #3DDC84; --green-soft: rgba(61, 220, 132, .15);
  --teal: #8BF0B8; --teal-soft: rgba(139, 240, 184, .13); --violet: #F0F5F1; --violet-soft: rgba(255, 255, 255, .09);
  --orange: #F2B04C; --orange-soft: rgba(242, 176, 76, .14); --red: #FF6B70; --red-soft: rgba(255, 107, 112, .14);
  --pill: #F0F5F1; --pill-ink: #050806; --bar: rgba(30, 36, 33, .72);
  --shadow: 0 1px 1px rgba(0, 0, 0, .4), 0 12px 32px rgba(0, 0, 0, .45); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #050806; --glow1: rgba(34, 197, 94, .22); --glow2: rgba(16, 163, 74, .12); --glow3: rgba(255, 255, 255, .04);
  --card: rgba(255, 255, 255, .07); --card2: rgba(255, 255, 255, .05); --solid: #111614;
  --glass: linear-gradient(180deg, rgba(255, 255, 255, .11), rgba(255, 255, 255, .045));
  --glass-edge: rgba(255, 255, 255, .13); --glass-hi: rgba(255, 255, 255, .2);
  --ink: #F0F5F1; --ink2: #CFDAD3; --muted: #8C9A91; --line: rgba(255, 255, 255, .09); --soft: rgba(255, 255, 255, .07);
  --accent: #3DDC84; --accent-ink: #04140A;
  --blue: #3DDC84; --blue-soft: rgba(61, 220, 132, .15); --green: #3DDC84; --green-soft: rgba(61, 220, 132, .15);
  --teal: #8BF0B8; --teal-soft: rgba(139, 240, 184, .13); --violet: #F0F5F1; --violet-soft: rgba(255, 255, 255, .09);
  --orange: #F2B04C; --orange-soft: rgba(242, 176, 76, .14); --red: #FF6B70; --red-soft: rgba(255, 107, 112, .14);
  --pill: #F0F5F1; --pill-ink: #050806; --bar: rgba(30, 36, 33, .72);
  --shadow: 0 1px 1px rgba(0, 0, 0, .4), 0 12px 32px rgba(0, 0, 0, .45); color-scheme: dark }

* { box-sizing: border-box }
html { background: var(--bg) }
body { margin: 0; min-height: 100vh; color: var(--ink); font: 500 14.5px/1.45 var(--font); -webkit-font-smoothing: antialiased;
  background: radial-gradient(900px 620px at -8% -6%, var(--glow1), transparent 62%), radial-gradient(760px 560px at 108% 18%, var(--glow2), transparent 60%), radial-gradient(900px 700px at 40% 112%, var(--glow3), transparent 62%), var(--bg); background-attachment: fixed }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
a { color: inherit }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px }
.n { font-variant-numeric: tabular-nums }
svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none }

.shell { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(110px + env(safe-area-inset-bottom, 0px)) }
.cols { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr) }
.view { min-width: 0 }
@media (min-width: 1080px) { .cols { grid-template-columns: minmax(0, 1fr) 360px; align-items: start } .rail { position: sticky; top: 84px } .shell { padding-bottom: 40px } }

/* header */
.top { display: flex; align-items: center; gap: 10px; padding-block: 16px 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6 }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; letter-spacing: .04em }
.logo b { width: 38px; height: 38px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 6px 16px rgba(18, 140, 74, .35) }
.top .sp { flex: 1 }
.rb { width: 40px; height: 40px; border-radius: 50%; background: var(--card); border: 0; box-shadow: var(--shadow); display: grid; place-items: center; cursor: pointer; position: relative; color: var(--ink) }
.rb .badge { position: absolute; top: 6px; right: 6px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 10px; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--solid) }
.me { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #22C55E, #0B0F0D); color: #fff; display: grid; place-items: center; font-weight: 800 }
.sync { font-size: 12px; color: var(--muted); white-space: nowrap }

/* nav pill */
.nav { display: none; background: var(--card); border-radius: 999px; padding: 6px; box-shadow: var(--shadow); gap: 4px; margin-bottom: 18px }
.nav button { flex: 1; border: 0; background: none; padding: 10px 14px; border-radius: 999px; font-weight: 600; cursor: pointer; color: var(--ink2); display: inline-flex; align-items: center; justify-content: center; gap: 8px }
.nav button[aria-current="page"] { background: var(--pill); color: var(--pill-ink) }
.cnt { font-size: 11px; font-weight: 700; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: inline-grid; place-items: center }

.tabbar { position: fixed; z-index: 8; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: min(420px, calc(100% - 28px)); background: var(--bar); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); border: 1px solid rgba(255, 255, 255, .14); border-radius: 999px; padding: 6px; display: grid; grid-template-columns: repeat(5, 1fr); box-shadow: 0 12px 40px rgba(0, 0, 0, .25) }
.tabbar button { border: 0; background: none; color: #fff; opacity: .62; padding: 9px 0 7px; border-radius: 999px; display: grid; justify-items: center; gap: 2px; font-size: 11px; font-weight: 600; cursor: pointer; position: relative }
.tabbar button[aria-current="page"] { opacity: 1; background: rgba(255, 255, 255, .16); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22); color: #fff }
.tabbar button[aria-current="page"] svg { color: #4ADE80 }
.tabbar .cnt { position: absolute; top: 2px; right: calc(50% - 22px); min-width: 16px; height: 16px; font-size: 10px }

/* hero */
.hero { display: grid; gap: 16px; margin: 4px 0 20px }
.hello { font-size: clamp(30px, 6vw, 40px); line-height: 1.04; font-weight: 800; letter-spacing: -.025em; margin: 0; text-wrap: balance }
.date { color: var(--muted); margin-top: 6px; font-weight: 500 }
.statrow { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
@media (min-width: 760px) { .statrow { grid-template-columns: repeat(4, minmax(0, 1fr)) } }
.stat { display: flex; align-items: center; gap: 12px; min-width: 0; background: var(--card); border-radius: 20px; padding: 12px 14px; box-shadow: var(--shadow) }
.stat .ic { width: 40px; height: 40px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; flex: none }
.stat b { display: block; font-size: 19px; font-weight: 800; letter-spacing: -.01em; line-height: 1.1 }
.stat span { font-size: 12px; color: var(--muted); display: block; line-height: 1.25 }
.stat.hot .ic { background: var(--orange-soft); color: var(--orange) }
.stat b span { display: inline; font-size: inherit; color: inherit }

/* cards */
.grid { display: grid; gap: 16px }
@media (min-width: 900px) { .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
.card { background: var(--card); border-radius: 24px; padding: 18px; box-shadow: var(--shadow); min-width: 0 }
.ch { display: flex; align-items: center; gap: 8px; margin-bottom: 12px }
.ch h3 { margin: 0; font-size: 15px; font-weight: 700 }
.ch .sp { flex: 1 }
.big { font-size: clamp(30px, 7vw, 40px); font-weight: 800; letter-spacing: -.03em; line-height: 1 }
.muted { color: var(--muted) }
.sm { font-size: 13px } .xs { font-size: 12px }
.row { display: flex; align-items: center; gap: 10px; min-width: 0 }
.grow { flex: 1; min-width: 0 }
.trunc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.stack { display: grid; gap: 10px }
.seg { display: inline-flex; background: var(--soft); border-radius: 999px; padding: 3px }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--muted); cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow) }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 10px 16px; font-weight: 600; font-size: 14px; text-decoration: none; cursor: pointer; white-space: nowrap }
.btn.dark { background: var(--pill); color: var(--pill-ink); border-color: var(--pill) }
.btn.full { width: 100% }
.btns { display: flex; flex-wrap: wrap; gap: 8px }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap }
.chip.g { background: var(--green-soft); color: var(--green) } .chip.r { background: var(--red-soft); color: var(--red) }
.chip.o { background: var(--orange-soft); color: var(--orange) } .chip.b { background: var(--blue-soft); color: var(--blue) } .chip.k { background: var(--soft); color: var(--ink2) }
.demo { display: flex; gap: 8px; align-items: center; background: color-mix(in srgb, var(--card) 70%, transparent); border: 1px dashed var(--muted); color: var(--muted); font-size: 12.5px; padding: 9px 14px; border-radius: 14px; margin-bottom: 16px }

/* needs */
.need { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 16px; background: var(--card2); border: 0; width: 100%; text-align: left; cursor: pointer }
.need .ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--soft) }
.need.r .ic { background: var(--red-soft); color: var(--red) } .need.o .ic { background: var(--orange-soft); color: var(--orange) } .need.b .ic { background: var(--blue-soft); color: var(--blue) }
.need .grow { display: block; text-align: left }
.need b { display: block; font-weight: 700; font-size: 14px }
.need .d { font-size: 12.5px; color: var(--muted) }

/* chart */
.chart > svg { width: 100%; height: auto; display: block; overflow: visible }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--muted); margin: 6px 0 10px }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); margin-right: 6px }
.legend i.dash { width: 14px; height: 0; border-radius: 0; border-top: 2px dashed var(--ink); background: none; vertical-align: middle }

/* route */
.route { position: relative; padding-left: 30px; display: grid; gap: 4px }
.route::before { content: ""; position: absolute; left: 11px; top: 14px; bottom: 14px; border-left: 2px dashed color-mix(in srgb, var(--blue) 45%, transparent) }
.stop { position: relative; padding: 10px 12px; border-radius: 14px; background: var(--card2) }
.stop::before { content: ""; position: absolute; left: -25px; top: 15px; width: 12px; height: 12px; border-radius: 50%; background: var(--card); border: 3px solid var(--blue) }
.stop.walk::before { background: var(--orange); border-color: var(--orange-soft) }
.stop.past { opacity: .5 }
.stop .t { font-size: 12px; font-weight: 700; color: var(--blue) }
.stop.walk .t { color: var(--orange) }
.stop .ttl { font-weight: 700 }
.stop .loc { font-size: 12.5px; color: var(--muted) }
.pick { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); cursor: pointer }
.pick:first-child { border-top: 0 }
.pick input { width: 20px; height: 20px; accent-color: var(--ink) }
details summary { cursor: pointer; font-weight: 700; list-style: none; display: flex; align-items: center; gap: 8px }
details summary::-webkit-details-marker { display: none }

/* rail: AI team */
.team { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px }
.mate { display: grid; justify-items: center; gap: 4px; font-size: 12px; font-weight: 600; flex: none; width: 56px }
.mate .av { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; position: relative }
.mate .av em { position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 10px; font-style: normal; display: grid; place-items: center; border: 2px solid var(--card) }
.mate.soon .av { background: var(--soft) !important; color: var(--muted); border: 1.5px dashed var(--muted) }
.mate.soon { color: var(--muted) }
.online { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--green); background: var(--green-soft); padding: 4px 10px; border-radius: 999px }
.online::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor }
.msgs { display: grid; gap: 10px; margin-top: 14px }
.day { text-align: center; font-size: 12px; color: var(--muted) }
.msg { display: grid; gap: 4px; max-width: 92% }
.msg .who { display: flex; gap: 8px; align-items: center; font-size: 12.5px; font-weight: 700 }
.msg .who small { color: var(--muted); font-weight: 500 }
.msg .tag { width: 24px; height: 24px; border-radius: 50%; font-size: 10.5px; display: grid; place-items: center; color: #fff; font-weight: 800 }
.bubble { background: var(--card2); border-radius: 4px 16px 16px 16px; padding: 10px 12px; font-size: 13.5px; color: var(--ink2) }
.msg.cam { justify-self: end }
.msg.cam .who { justify-content: flex-end }
.msg.cam .bubble { background: var(--blue-soft); color: var(--ink); border-radius: 16px 4px 16px 16px }
.compose { display: flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); border-radius: 999px; padding: 5px 5px 5px 14px; margin-top: 14px; background: var(--card) }
.compose:focus-within { border-color: var(--blue) }
.compose input { border: 0; outline: 0; background: none; flex: 1; min-width: 0; padding: 6px 0 }
.compose .btn { padding: 8px 12px; font-size: 13px }

/* houses board */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(262px, 1fr); gap: 12px; overflow-x: auto; padding: 2px 2px 14px; scroll-snap-type: x mandatory }
.col { background: color-mix(in srgb, var(--card) 55%, transparent); border-radius: 22px; padding: 12px; display: grid; gap: 10px; align-content: start; scroll-snap-align: start; min-width: 0 }
.colh { display: grid; gap: 2px; padding: 2px 4px 6px }
.colh b { font-size: 14px }
.colh b span { color: var(--muted); font-weight: 600; margin-left: 4px }
.colh .xs { color: var(--muted) }
.colbar { height: 3px; border-radius: 2px; margin-top: 8px }
.hc { background: var(--card); border-radius: 18px; padding: 8px; box-shadow: var(--shadow); border: 0; text-align: left; cursor: pointer; display: grid; gap: 10px; width: 100%; color: var(--ink) }
.facade { position: relative; height: 92px; border-radius: 13px; overflow: hidden; display: flex; align-items: flex-end; padding: 10px }
.facade svg.h { position: absolute; right: -6px; bottom: -4px; width: 120px; height: 100px; opacity: .9 }
.facade .no { font-size: 30px; font-weight: 800; letter-spacing: -.03em; line-height: 1; position: relative }
.facade .lab { position: absolute; top: 8px; left: 8px; background: var(--card); color: var(--ink); font-size: 10.5px; font-weight: 800; letter-spacing: .06em; padding: 3px 8px; border-radius: 7px }
.hc .body { padding: 0 6px 6px; display: grid; gap: 6px }
.hc .nm { font-weight: 800; font-size: 14.5px }
.hc .who { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted) }
.mini { width: 20px; height: 20px; border-radius: 50%; background: var(--soft); color: var(--ink2); font-size: 9.5px; font-weight: 800; display: grid; place-items: center; flex: none }
.hc .price { display: flex; align-items: center; justify-content: space-between; gap: 8px }
.hc .price b { font-size: 17px; font-weight: 800 }
.hc .foot { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px }
.bar { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--blue) }
.bar.w i { background: var(--orange) } .bar.x i { background: var(--red) }
.list { display: grid; gap: 10px }
@media (min-width: 760px) { .list { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)) } }

/* sheet */
.sheet { position: fixed; inset: 0; z-index: 20; overflow-y: auto; background: var(--bg); padding-top: env(safe-area-inset-top, 0px) }
.sheet .shell { max-width: 880px; padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)) }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
@media (min-width: 640px) { .kv { grid-template-columns: repeat(4, minmax(0, 1fr)) } }
.kv div { background: var(--card2); border-radius: 14px; padding: 10px 12px; min-width: 0 }
.kv span { font-size: 12px; color: var(--muted); display: block }
.kv b { font-size: 16px; font-weight: 800; overflow-wrap: anywhere }
.pos { color: var(--green) } .neg { color: var(--red) }
table { width: 100%; border-collapse: collapse; font-size: 13.5px }
td, th { padding: 9px 4px; border-top: 1px solid var(--line); text-align: left; vertical-align: top }
th { font-size: 12px; color: var(--muted); font-weight: 600; border-top: 0 }
td.r, th.r { text-align: right }
.scroll { overflow-x: auto }

/* forms + gauge */
.field { display: grid; gap: 5px; min-width: 0 }
.field label { font-size: 12px; color: var(--muted); font-weight: 600 }
.field input, .sel { width: 100%; border: 1.5px solid var(--line); background: var(--card2); border-radius: 12px; padding: 10px 12px; font-weight: 600; font-variant-numeric: tabular-nums }
.field input:focus, .sel:focus { border-color: var(--blue); outline: 0 }
.g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
@media (min-width: 640px) { .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)) } }
.gauge { position: relative; max-width: 360px; margin: 0 auto }
.gauge svg { width: 100%; height: auto; display: block }
.gauge .mid { position: absolute; left: 0; right: 0; bottom: 6%; text-align: center; display: grid; justify-items: center; gap: 4px }
.gauge .mid .big { font-size: clamp(28px, 7vw, 38px) }
.alert { display: flex; gap: 10px; align-items: flex-start; border-radius: 14px; padding: 12px 14px; font-size: 13.5px }
.alert.r { background: var(--red-soft); color: var(--red) } .alert.g { background: var(--green-soft); color: var(--green) }
.search { display: flex; gap: 8px }
.search input { flex: 1; min-width: 0; border: 1.5px solid var(--line); background: var(--card2); border-radius: 999px; padding: 10px 16px }

  var P = findTab(raw, /propert|house|portfolio|deals?$/i, /ledger|budget|log|lender|check/i);

  var p = getter(P, {

    arv: [/arv|after.?repair/i], sale: [/sale price|list price|asking|sold for|sell price|exit price/i],

  var budgetsByHouse = [];

  var houses = (P ? P.rows : []).filter(function (r) { return String(p.get(r, 'addr')).trim() }).map(function (r) {

      lender: p.get(r, 'lender'), llc: p.get(r, 'llc'), folder: p.get(r, 'folder'), parcel: p.get(r, 'parcel'),

      loan: num(p.get(r, 'loan')), rate: num(p.get(r, 'rate')), rent: num(p.get(r, 'rent')),
      pdate: dt(p.get(r, 'pdate')), closing: dt(p.get(r, 'closing')),

    h.stage = stageOf(h.status);
    if (h.rate != null && h.rate > 0 && h.rate < 1) h.rate = h.rate * 100;
    h.lines = ledger.filter(function (x) { return !x.unsorted && sameHouse(x.house, h.addr) });
    var ledgerSpent = h.lines.reduce(function (s, x) { return s + x.amount }, 0);

    if (h.budget == null && budgetsByHouse.length) {

    var mnum = String(h.addr).match(/^\s*(\d+)/);

    return h;
  });

  var events = (raw.events || []).map(function (e) {
    var ev = { title: e.title, start: new Date(e.start), end: e.end ? new Date(e.end) : null, allDay: e.allDay, location: e.location || '', note: e.note || '', error: e.error };
    ev.house = houses.filter(function (h) {

  }).sort(function (a, b) { return a.start - b.start });

  var log = (W ? W.rows : []).map(function (r) { return { date: dt(w.get(r, 'date')), who: w.get(r, 'who'), what: w.get(r, 'what'), hrs: num(w.get(r, 'hrs')) } })

  // Price Book tab (Item, Unit, Cost) replaces the starting prices line by line.
  var pb = {}, PB = findTab(raw, /price\s*book|unit\s*cost|rehab\s*price/i);
  if (PB) {

    PB.rows.forEach(function (r) {

      var hits = ITEMS.filter(function (it) { return it.id.toLowerCase() === t.toLowerCase() || it.re.test(t) });
      if (hits.length > 1) hits = hits.filter(function (it) { return norm(it.name).indexOf(norm(t)) >= 0 || it.id.toLowerCase() === t.toLowerCase() });

  }
  // What Sam actually paid per house, from single-trade ledger lines ("Roof", not "Roof + siding").
  var hist = {};
  ITEMS.forEach(function (it) {
    var by = {};
    ledger.forEach(function (x) { if (!x.unsorted && x.cat && it.re.test(x.cat) && !/[+&]|\band\b/i.test(x.cat)) { var k = norm(x.house); by[k] = (by[k] || 0) + x.amount } });
    var v = Object.keys(by).map(function (k) { return by[k] });
    if (v.length) hist[it.id] = { n: v.length, avg: v.reduce(function (s, a) { return s + a }, 0) / v.length };
  });

  return { raw: raw, cfg: cfg, now: now, P: P, L: L, W: W, p: p, l: l, houses: houses, ledger: ledger, events: events, log: log, extra: extra, sellPct: sellPct, pb: pb, PB: PB, hist: hist };
}

/* ---------- needs ---------- */
function needs(m) {
  var out = [];
  var uns = m.ledger.filter(function (x) { return x.unsorted });
  if (uns.length) out.push({ cls: 'o', ic: 'wallet', t: uns.length + ' payment' + (uns.length > 1 ? 's' : '') + ' need a house', d: money(uns.reduce(function (s, x) { return s + x.amount }, 0)) + ' with no house on it. Tap to say which house.', tool: 'unsorted' });
  m.events.filter(function (e) { return e.start - m.now < 2 * DAY && e.start - startOfDay(m.now) >= 0 && /wire|verify|fraud|new account/i.test(e.title + ' ' + e.note) })
    .forEach(function (e) { out.push({ cls: 'r', ic: 'alert', t: e.title, d: 'Before you send money, call them on a number you already know · ' + dayName(e.start) }) });
  var over = m.houses.filter(function (h) { return h.active && h.pct != null && h.pct > 1 });
  if (over.length) out.push({ cls: 'r', ic: 'flame', t: over.length + ' house' + (over.length > 1 ? 's' : '') + ' over budget', d: over.map(function (h) { return h.addr + ' ' + Math.round(h.pct * 100) + '%' }).join(' · '), go: 'houses' });
  var closings = m.events.filter(function (e) { return e.start >= startOfDay(m.now) && e.start - m.now < 7 * DAY && /clos|alta|title|refi|signing|settle/i.test(e.title) });
  if (closings.length) out.push({ cls: 'b', ic: 'cal', t: closings.length + ' closing' + (closings.length > 1 ? 's' : '') + ' this week', d: closings.map(function (e) { return e.title + ' · ' + dayName(e.start) }).join(' · ') });
  var conf = m.houses.filter(function (h) { return h.confirm });
  if (conf.length) out.push({ cls: '', ic: 'check', t: 'Check ' + conf.length + ' house' + (conf.length > 1 ? 's' : ''), d: 'We filled in where these are at. Tap and say if it’s right.', go: 'houses' });
  var lg = lenderGroups(m);
  if (lg.length && !m.cfg.autoLenders && !store('lenders.' + weekKey())) out.push({ cls: 'b', ic: 'send', t: 'Send your lenders this week’s update', d: lg.length + ' lender' + (lg.length > 1 ? 's' : '') + '. The emails are written; you just read and send.', tool: 'lenders' });

  return out;
}

/* ---------- spend chart (weekly rehab spend) ---------- */
function spendChart(m, weeks) {
  var end = startOfDay(m.now); end.setDate(end.getDate() + 1);
  var b = []; for (var i = weeks - 1; i >= 0; i--) b.push({ s: new Date(end - (i + 1) * 7 * DAY), e: new Date(end - i * 7 * DAY), v: 0 });
  m.ledger.forEach(function (x) { if (!x.date) return; b.forEach(function (k) { if (x.date >= k.s && x.date < k.e) k.v += x.amount }) });
  var total = b.reduce(function (s, k) { return s + k.v }, 0), avg = total / weeks;
  var W = 640, H = 220, L = 46, R = 10, T = 12, Bm = 28;
  var max = Math.max.apply(null, b.map(function (k) { return k.v }).concat([avg, 1]));
  var step = Math.pow(10, Math.floor(Math.log10(max))); var nice = [1, 2, 2.5, 5, 10].map(function (f) { return f * step }).filter(function (v) { return v * 2 >= max })[0] || step * 10;
  var top = Math.ceil(max / nice) * nice;
  var x = function (i) { return L + (W - L - R) * (i / (weeks - 1)) }, y = function (v) { return T + (H - T - Bm) * (1 - v / top) };
  var pts = b.map(function (k, i) { return [x(i), y(k.v)] });
  var d = 'M' + pts[0][0] + ',' + pts[0][1];
  for (var j = 1; j < pts.length; j++) {
    var p0 = pts[j - 2] || pts[j - 1], p1 = pts[j - 1], p2 = pts[j], p3 = pts[j + 1] || p2;
    var c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    c1[1] = Math.min(c1[1], H - Bm); c2[1] = Math.min(c2[1], H - Bm);
    d += ' C' + c1[0].toFixed(1) + ',' + c1[1].toFixed(1) + ' ' + c2[0].toFixed(1) + ',' + c2[1].toFixed(1) + ' ' + p2[0].toFixed(1) + ',' + p2[1].toFixed(1);
  }
  var area = d + ' L' + x(weeks - 1) + ',' + (H - Bm) + ' L' + L + ',' + (H - Bm) + ' Z';
  var grid = [0, top / 2, top].map(function (v) { return '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line)"/><text x="' + (L - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + kmoney(v) + '</text>' }).join('');
  var labs = b.map(function (k, i) { return i % Math.ceil(weeks / 6) === 0 || i === weeks - 1 ? '<text x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="var(--muted)">' + md(k.s) + '</text>' : '' }).join('');
  var last = pts[pts.length - 1];
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Weekly rehab spend"><defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--blue)" stop-opacity=".22"/><stop offset="1" stop-color="var(--blue)" stop-opacity="0"/></linearGradient></defs>' +
    grid + '<path d="' + area + '" fill="url(#gf)"/><line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(avg) + '" y2="' + y(avg) + '" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="6 5" opacity=".7"/>' +
    '<path d="' + d + '" fill="none" stroke="var(--blue)" stroke-width="2.6" stroke-linecap="round"/><circle cx="' + last[0] + '" cy="' + last[1] + '" r="5" fill="var(--card)" stroke="var(--blue)" stroke-width="2.6"/>' + labs + '</svg>';
  return { svg: svg, total: total, avg: avg, last: b[b.length - 1].v };
}
